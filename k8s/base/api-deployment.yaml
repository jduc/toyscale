apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: toyscale
spec:
  # Exactly ONE: the orchestrator keeps its queue in memory, so two copies would
  # each have their own queue and both start Jobs (2 x max 5). See docs/06.
  replicas: 1
  strategy:
    type: Recreate # stop the old pod BEFORE starting the new one (never 2 orchestrators)
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Run as the "api" identity: Kubernetes mounts its token into the pod,
      # and the kubernetes Python client finds it (load_incluster_config).
      serviceAccountName: api
      containers:
        - name: api
          image: toyscale-api # tag set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NAMESPACE
              value: analyses
            - name: WORKER_IMAGE
              value: toyscale-worker:0.1.0
            - name: MAX_RUNNING
              value: "5"
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          # Kubernetes calls /healthz to decide if the pod is healthy:
          readinessProbe: # failing = "don't send me traffic yet" (removed from the Service)
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe: # failing = "I'm stuck, restart me"
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: toyscale
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: http
