# Kustomize: a list of manifests applied together with `kubectl apply -k k8s/base`,
# plus small transformations, here setting image tags in one place.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- api-rbac.yaml
- analyses-quota.yaml
- api-deployment.yaml

images:
- name: toyscale-api
  newName: toyscale-api
  newTag: 0.1.1
